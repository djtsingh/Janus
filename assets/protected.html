<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected — Janus Gateway</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg:       #06090f;
      --surface:  rgba(12,18,30,0.82);
      --border:   rgba(255,255,255,0.06);
      --gold:     #d4a547;
      --gold-dim: rgba(212,165,71,0.10);
      --blue:     #4db8db;
      --text:     #e0e4ef;
      --text2:    #8d95ab;
      --muted:    #4a5270;
      --success:  #3ee88a;
      --mono:     'SF Mono','Fira Code','Cascadia Code','JetBrains Mono','Consolas',monospace;
      --sans:     'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;
    }
    html, body {
      width: 100%; min-height: 100vh;
      background: var(--bg); color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    .page {
      position: relative; z-index: 1; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 32px; padding: 48px 20px;
    }

    /* ── Hero ─────────────────────────────────────────────────── */
    .hero { display: flex; flex-direction: column; align-items: center; gap: 20px; }

    .shield {
      width: 88px; height: 88px; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .shield-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(62,232,138,0.3);
      animation: shield-pulse 3s ease-in-out infinite;
    }
    @keyframes shield-pulse {
      0%,100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(62,232,138,0.2); }
      50%     { transform: scale(1.06); opacity: 0.7; box-shadow: 0 0 30px rgba(62,232,138,0.15); }
    }
    .shield-icon {
      font-size: 36px; position: relative; z-index: 1;
      filter: drop-shadow(0 0 12px rgba(62,232,138,0.4));
    }

    .hero-text { text-align: center; }
    .hero-text h1 {
      font-size: 22px; font-weight: 700; letter-spacing: 0.01em;
      color: var(--success); margin-bottom: 6px;
    }
    .hero-text p {
      font-size: 13px; color: var(--text2); line-height: 1.6;
    }

    /* ── Info Card ────────────────────────────────────────────── */
    .info-card {
      width: 100%; max-width: 520px;
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 120px rgba(212,165,71,0.04);
      animation: card-in 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .info-accent {
      height: 2px;
      background: linear-gradient(90deg, var(--success), var(--blue), var(--gold));
    }
    .info-body { padding: 28px 28px 24px; }

    .info-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px;
    }
    .info-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success);
    }
    .info-title {
      font-size: 11px; font-family: var(--mono); letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--success);
    }

    /* ── Stats Grid ──────────────────────────────────────────── */
    .stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 20px;
    }
    .stat {
      padding: 14px 16px; border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(6,9,15,0.5);
    }
    .stat-label {
      font-size: 9.5px; font-family: var(--mono); letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
    }
    .stat-value {
      font-size: 13px; font-weight: 600; color: var(--text);
      word-break: break-all;
    }
    .stat-value.gold { color: var(--gold); }
    .stat-value.blue { color: var(--blue); }

    /* ── Janus Badge ─────────────────────────────────────────── */
    .info-sep { height: 1px; background: var(--border); margin: 16px 0; }

    .janus-badge {
      display: flex; align-items: center; justify-content: space-between;
    }
    .badge-left {
      display: flex; align-items: center; gap: 10px;
    }
    .badge-sigil {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
    }
    .badge-sigil svg { width: 100%; height: 100%; }
    .badge-text {
      font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
    }
    .badge-text b { color: rgba(212,165,71,0.6); font-weight: 600; }
    .badge-version {
      font-size: 9px; font-family: var(--mono); color: var(--muted);
      padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    .page-footer {
      font-size: 10px; letter-spacing: 0.15em;
      text-transform: uppercase; color: rgba(74,82,112,0.35);
    }

    @media (max-width: 500px) {
      .page { padding: 32px 14px; gap: 24px; }
      .info-body { padding: 22px 18px 18px; }
      .stats { grid-template-columns: 1fr; }
      .hero-text h1 { font-size: 19px; }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <main class="page">

    <div class="hero">
      <div class="shield">
        <div class="shield-ring"></div>
        <div class="shield-icon">&#128274;</div>
      </div>
      <div class="hero-text">
        <h1>Access Granted</h1>
        <p>You have been verified by the Janus Gateway Security Protocol.<br>
           Your session is active and protected.</p>
      </div>
    </div>

    <div class="info-card">
      <div class="info-accent"></div>
      <div class="info-body">

        <div class="info-header">
          <div class="info-dot"></div>
          <span class="info-title">Session Active</span>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Status</div>
            <div class="stat-value gold">Verified</div>
          </div>
          <div class="stat">
            <div class="stat-label">Token Expiry</div>
            <div class="stat-value blue" id="token-expiry">24h</div>
          </div>
          <div class="stat">
            <div class="stat-label">Verified At</div>
            <div class="stat-value" id="verified-at">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">Protocol</div>
            <div class="stat-value">PoW + Behavioral</div>
          </div>
        </div>

        <div class="info-sep"></div>

        <div class="janus-badge">
          <div class="badge-left">
            <div class="badge-sigil">
              <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M26 11 A15 15 0 0 0 26 41" stroke="#d4a547" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                <path d="M26 11 A15 15 0 0 1 26 41" stroke="#4db8db" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                <circle cx="18" cy="23" r="2" fill="#d4a547"/>
                <circle cx="34" cy="23" r="2" fill="#4db8db"/>
              </svg>
            </div>
            <span class="badge-text">Protected by <b>Janus</b></span>
          </div>
          <span class="badge-version">v0.2</span>
        </div>

      </div>
    </div>

    <p class="page-footer">Gateway security protocol active</p>

  </main>

<script>
  // Populate "Verified At" with current time
  document.getElementById('verified-at').textContent =
    new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  // Particle background
  (function() {
    var cv = document.getElementById('bg-canvas');
    if (!cv) return;
    var ctx = cv.getContext('2d');
    var dpr = window.devicePixelRatio || 1, W, H, P = [];
    function resize() {
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', resize); resize();
    var N = Math.min(45, Math.floor(W * H / 22000));
    for (var i = 0; i < N; i++) {
      P.push({ x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2,
        r: Math.random()*1.2+0.4, a: Math.random()*0.2+0.04 });
    }
    function frame() {
      ctx.clearRect(0,0,W,H);
      for (var i = 0; i < P.length; i++) {
        var p = P[i]; p.x += p.vx; p.y += p.vy;
        if(p.x<0) p.x=W; if(p.x>W) p.x=0;
        if(p.y<0) p.y=H; if(p.y>H) p.y=0;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle='rgba(62,232,138,'+p.a+')'; ctx.fill();
        for (var j = i+1; j < P.length; j++) {
          var q=P[j], dx=p.x-q.x, dy=p.y-q.y, d=dx*dx+dy*dy;
          if(d<12000){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);
            ctx.strokeStyle='rgba(77,184,219,'+(0.04*(1-d/12000))+')';ctx.lineWidth=0.4;ctx.stroke();}
        }
      }
      requestAnimationFrame(frame);
    }
    frame();
  })();
</script>
</body>
</html>
