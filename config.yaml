suspicion_threshold: 10
suspicion_weights:
  blacklisted_ip: 100
  banned_geo: 80
  tls_mismatch: 30
  no_user_agent: 40
  headless_browser: 30
  missing_headers: 20
  header_order_mismatch: 40

# IP lists - localhost blacklisted to test bot workflow
blacklisted_ips: []
whitelist_ips: ["127.0.0.1", "::1"]
whitelist_ua: []
banned_geo_locations: []

# Redis connection (use localhost:6379 for local dev, redis:6379 for Docker)
redis_addr: "localhost:6379"

# Rate limiting
rate_limit:
  requests_per_minute: 60
  burst: 10

# Challenge difficulty (lower = faster, higher = more CPU intensive)
desktop_difficulty: 8
mobile_difficulty: 6
desktop_iterations: 5000
mobile_iterations: 5000

# =============================================================================
# TARPIT SETTINGS - Adaptive bot mitigation
# =============================================================================
# When enabled, suspicious requests face progressive delays and harder challenges
tarpit:
  enabled: true
  delay_per_score_ms: 50        # Delay in ms per suspicion point (score=40 → 2s delay)
  max_delay_ms: 10000           # Maximum delay cap (10 seconds)
  difficulty_multiplier: 4      # Extra PoW difficulty per risk tier
  offender_memory_mins: 30      # How long to remember repeat offenders
  repeat_penalty: 2             # Extra difficulty added per repeat offense